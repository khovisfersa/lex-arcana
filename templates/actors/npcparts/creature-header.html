<div class="la-resources">
    <div class="la-cartouche health">
        <span class="la-label">{{ localize "LexArcana.HitPoints" }}</span>
        <div class="la-cartouche-values">
            <input name="system.hitPoints" type="text" value="{{actor.system.hitPoints}}" placeholder="4"/>
        </div>
    </div>
    <div class="la-cartouche dice">
        <span class="la-label">{{ localize "LexArcana.DiceValue" }}</span>
        <div class="la-cartouche-values">
            <select name="system.diceValue">
                {{selectOptions config.DiceValues selected=actor.system.diceValue}}
            </select>
        </div>
    </div>
    <div class="la-cartouche size">
        <span class="la-label">{{ localize "LexArcana.Size" }}</span>
        <div class="la-cartouche-values">
            <input name="system.size" type="text" value="{{actor.system.size}}" placeholder="1"/>
        </div>
    </div>
    <div class="la-cartouche danger">
        <span class="la-label">{{ localize "LexArcana.degreeOfDanger" }}</span>
        <div class="la-cartouche-values">
            <input name="system.degreeOfDanger" type="text" value="{{actor.system.degreeOfDanger}}" placeholder="1"/>
        </div>
    </div>
</div>
