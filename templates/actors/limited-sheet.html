<div class="lexarcana-sheet {{cssClass}} flexcol limited">

    {{!-- Sheet Header --}}
    <header class="sheet-header flexrow">
        <img class="profile" src="{{actor.img}}" title="{{actor.name}}" data-edit="img" data-action="editImage"/>

        <section class="header-details flexrow">
            <h1 class="charname">
                <input name="name" type="text" value="{{actor.name}}" placeholder="{{ localize 'LexArcana.Name' }}"/>
            </h1>
        </section>
    </header>

    {{!-- Sheet Body --}}
    <section class="sheet-body">
        <div class="tab biography">
            <prose-mirror name="system.biography" value="{{actor.system.biography}}" toggled data-document-uuid="{{document.uuid}}">{{{enriched.biography}}}</prose-mirror>
        </div>
    </section>
</div>
