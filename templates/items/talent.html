<div class="lexarcana-sheet {{cssClass}} flexcol">

    {{!-- Item Sheet Header --}}
    <header class="sheet-header flexrow">
        <img class="profile" src="{{item.img}}" title="{{item.name}}" data-edit="img" data-action="editImage"/>

        <div class="header-details flexrow">
            <h1 class="charname">
                <input name="name" type="text" value="{{item.name}}" placeholder="{{ localize 'LexArcana.ItemName' }}"/>
            </h1>

            <div class="item-subtitle">
                <h4 class="item-type">{{localize (concat "TYPES.Item." item.type)}}</h4>
            </div>
        </div>
    </header>

    {{!-- Custos Sheet Navigation --}}
    <nav class="sheet-navigation tabs" data-group="primary">
        <a class="item" data-action="tab" data-group="primary" data-tab="description">{{ localize "LexArcana.Description" }}</a>
    </nav>

    {{!-- Item Sheet Body --}}
    <section class="sheet-body">

        {{!-- Description --}}
        <div class="description tab flexrow" data-group="primary" data-tab="description">
			<prose-mirror name="system.description" value="{{item.system.description}}" toggled data-document-uuid="{{document.uuid}}">{{{enriched.description}}}</prose-mirror>
        </div>
    </section>
</div>
